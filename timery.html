<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neverness to Everness - Poradniki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/logonte.png">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div></div>
        <div style="display: flex; justify-content: flex-end; padding-right: 10px;">
            <img src="img/logonte.png" alt="logo" style="width: 60px; height: 60px; margin: 10px 10px 10px 10px;" >
        </div>
        
        <div style="display: flex; justify-content: flex-start;">
            <a href="index.html" class="logo">
                Neverness Guide
            </a>
        </div>
        <div class="navbar-container">
            <button class="menu-toggle" onclick="toggleMenu()">☰</button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="active">Strona główna</a></li>
                <li><a href="poradniki.html">Poradniki</a></li>
            </ul>
        </div>
    </nav>

    <div id="categoriesPage">
        <div class="container">
            <section class="hero">
                <h1>Lista godzin i timery resetów:</h1>
            </section>
            
            
            <div class="categories-grid-timery">

                <div class="category-card-timery" onclick="showPage('heist-guide')">  
                    <div class="category-icon-timery">
                        <div></div>
                        <div>🕑</div>
                        <div></div>
                    </div>
                    <div class="timerdiv1">
                        <span style="color: #92C286; font-size: 35px;">Dzienny reset</span>
                        <span>Codziennie o godzinie 05:00</span>
                        <span>Reset za:&nbsp<span class="reset-timer" data-hour="5"></span></span>
                    </div>
                </div>
                
                <div class="category-card-timery" onclick="showPage('heist-guide')">  
                    <div class="category-icon-timery">
                        <div></div>
                        <div>⚡</div>
                        <div></div>
                    </div>
                    <div class="timerdiv1">
                        <span style="color: #92C286; font-size: 35px;">City Stamina</span>
                        <span>Poniedziałek o godzinie 05:00</span>
                        <span>Reset za:&nbsp<span class="reset-timer" data-day="1" data-hour="5"></span></span>
                    </div>
                </div>

                <div class="category-card-timery" onclick="showPage('heist-guide')">  
                    <div class="category-icon-timery">
                        <div></div>
                        <div>💰</div>
                        <div></div>
                    </div>
                    <div class="timerdiv1">
                        <span style="color: #92C286; font-size: 35px;">Pink Paws Heist</span>
                        <span>Poniedziałek co 2 tygodznie o godzinie 05:00</span>
                        <span>Reset za:&nbsp<span class="reset-timer" data-day="1" data-hour="5" data-every="2w"></span></span>
                    </div>
                </div>

            </div>
        </div>
    </div>




   
    <script src="script.js"></script>
</body>
</html>
